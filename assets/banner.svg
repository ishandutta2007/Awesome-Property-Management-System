<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A">
        <animate attributeName="stop-color" values="#0F172A;#1E1B4B;#0F172A" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1E293B">
        <animate attributeName="stop-color" values="#1E293B;#311B92;#1E293B" dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#0284C7">
        <animate attributeName="stop-color" values="#0284C7;#0369A1;#0284C7" dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rectangle -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Glowing Waves / Floating Orbs -->
  <circle cx="150" cy="80" r="140" fill="#38BDF8" opacity="0.15" filter="blur(40px)">
    <animate attributeName="cy" values="80;120;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="240" r="160" fill="#F43F5E" opacity="0.15" filter="blur(50px)">
    <animate attributeName="cy" values="240;200;240" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Abstract Property / Real Estate Building Graphics -->
  <g transform="translate(850, 40)" opacity="0.85" filter="url(#shadow)">
    <!-- Building 1 -->
    <rect x="0" y="80" width="60" height="160" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <rect x="12" y="100" width="12" height="12" rx="2" fill="#38BDF8" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" y="100" width="12" height="12" rx="2" fill="#38BDF8" opacity="0.5"/>
    <rect x="12" y="125" width="12" height="12" rx="2" fill="#38BDF8" opacity="0.9"/>
    <rect x="36" y="125" width="12" height="12" rx="2" fill="#38BDF8" opacity="0.3">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="12" y="150" width="12" height="12" rx="2" fill="#38BDF8" opacity="0.7"/>
    <rect x="36" y="150" width="12" height="12" rx="2" fill="#38BDF8" opacity="0.8"/>

    <!-- Building 2 (Main Tower) -->
    <rect x="75" y="30" width="80" height="210" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="2.5"/>
    <polygon points="75,30 115,0 155,30" fill="#818CF8" opacity="0.6"/>
    <rect x="90" y="55" width="16" height="16" rx="3" fill="#818CF8" opacity="0.8"/>
    <rect x="119" y="55" width="16" height="16" rx="3" fill="#818CF8" opacity="0.4"/>
    <rect x="90" y="85" width="16" height="16" rx="3" fill="#818CF8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.2;0.9" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="119" y="85" width="16" height="16" rx="3" fill="#818CF8" opacity="0.7"/>
    <rect x="90" y="115" width="16" height="16" rx="3" fill="#818CF8" opacity="0.5"/>
    <rect x="119" y="115" width="16" height="16" rx="3" fill="#818CF8" opacity="1">
      <animate attributeName="opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <!-- Building 3 -->
    <rect x="170" y="110" width="55" height="130" rx="4" fill="#1E293B" stroke="#F43F5E" stroke-width="2"/>
    <rect x="182" y="130" width="10" height="10" rx="2" fill="#F43F5E" opacity="0.7"/>
    <rect x="202" y="130" width="10" height="10" rx="2" fill="#F43F5E" opacity="0.4"/>
    <rect x="182" y="150" width="10" height="10" rx="2" fill="#F43F5E" opacity="0.9"/>
    <rect x="202" y="150" width="10" height="10" rx="2" fill="#F43F5E" opacity="0.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Typography & Content -->
  <g transform="translate(70, 0)">
    <!-- Badge -->
    <rect x="0" y="52" width="220" height="32" rx="16" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="110" y="73" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="135" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Awesome Property
    </text>
    <text x="0" y="182" fill="url(#glowGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">
      Management Systems
    </text>

    <!-- Subtitle -->
    <text x="0" y="225" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" width="600">
      Leading Commercial SaaS Platforms &amp; Top Open-Source GitHub Repositories
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 252)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="70" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">🏢 Residential &amp; HOA</text>

      <!-- Pill 2 -->
      <rect x="150" y="0" width="135" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="217" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">⚡ Open-Source</text>

      <!-- Pill 3 -->
      <rect x="295" y="0" width="140" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1"/>
      <text x="365" y="18" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle">💼 Commercial SaaS</text>
    </g>
  </g>
</svg>
